<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Social preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&family=Lato:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5efe2;
        --ink: #2a241b;
        --ink-soft: #5a5144;
        --accent: #7f6027;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        padding: 80px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Lato', sans-serif;
      }
      h1 {
        font-family: 'Kumbh Sans', sans-serif;
        font-weight: 700;
        font-size: 72px;
        line-height: 1.1;
        letter-spacing: -0.01em;
        max-width: 18ch;
      }
      .name { font-family: 'Kumbh Sans', sans-serif; font-weight: 700; font-size: 30px; margin-top: 28px; }
      .eyebrow {
        font-family: 'Kumbh Sans', sans-serif;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .url { font-size: 26px; color: var(--ink-soft); margin-top: 14px; }
    </style>
  </head>
  <body>
    <div>
      <h1>Search digital collections, even with little or no metadata.</h1>
      <p class="name">Digital Collections Explorer</p>
    </div>
    <div>
      <p class="eyebrow">Open source · Self-hosted · For galleries, libraries, archives and museums</p>
      <p class="url">l4cch.github.io/dce-website</p>
    </div>
  </body>
</html>
